name: Avisar a FinOps

# Se dispara cuando la GitHub App de Cloudability termina un check en un PR.
# El archivo tiene que estar en la rama main para que GitHub lo ejecute.
on:
  check_run:
    types: [completed]

permissions:
  pull-requests: write

jobs:
  avisar:
    if: >-
      startsWith(github.event.check_run.name, 'Governance - ') &&
      github.event.check_run.conclusion == 'failure' &&
      github.event.check_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Comentar en el PR mencionando a los aprobadores
        uses: actions/github-script@v7
        env:
          APROBADORES: ${{ vars.FINOPS_APPROVERS }}
        with:
          script: |
            const check = context.payload.check_run;
            const aprobadores = process.env.APROBADORES || '(define la variable FINOPS_APPROVERS)';
            const marcador = '<!-- aviso-finops -->';
            const { owner, repo } = context.repo;
            for (const pr of check.pull_requests) {
              const body = [
                marcador,
                `**${check.name}** falló en este PR.`,
                '',
                `${aprobadores}: si el cambio está justificado, revisen y aprueben la excepción en Cloudability → Governance → Pull Requests.`,
                `Detalle del check: ${check.html_url}`,
              ].join('\n');
              const comentarios = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
              const previo = comentarios.find(c => c.body && c.body.includes(marcador) && c.body.includes(check.name));
              if (previo) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              }
            }

      - name: Avisar por Slack o Teams (opcional)
        if: env.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.FINOPS_WEBHOOK_URL }}
          TEXTO: "Cloudability bloqueó el PR #${{ github.event.check_run.pull_requests[0].number }} de ${{ github.repository }} (${{ github.event.check_run.name }}). Revisar en Cloudability → Governance → Pull Requests: ${{ github.event.check_run.html_url }}"
        run: |
          jq -n --arg text "$TEXTO" '{text: $text}' | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK_URL"
